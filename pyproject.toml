[project]
name = "fantasy"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcp>=2",
  "yfpy>=16",
  "nflreadpy",
  "httpx",
  "python-dotenv",
]

[project.optional-dependencies]
web = ["fastapi", "uvicorn", "paramiko"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fantasy"]
